[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-gate"
version = "0.1.0"
description = "Gate LLM model promotion on a small golden-set eval, plus a careful lm-evaluation-harness wrapper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joseph Crabtree", email = "thejoecrabtree@gmail.com" }]
keywords = ["llm", "evaluation", "vllm", "openai-compatible", "lm-eval", "regression"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# lm-eval is deliberately not a hard dependency: `evalgate bench` prints the
# commands it would run when lm_eval is not installed.
bench = ["lm-eval[api]>=0.4.5"]

[project.urls]
Homepage = "https://github.com/thejoecrabtree/llm-eval-gate"

[project.scripts]
evalgate = "evalgate.cli:main"
evalgate-bench = "evalgate.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
